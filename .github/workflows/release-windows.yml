name: Publication Windows

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Déterminer la version
        id: version
        shell: pwsh
        run: |
          $name = "${{ github.ref_name }}"
          $version = $name.Split('/')[-1].TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Contrôles avant publication
        run: dotnet run --project tests/Atlas.Core.SmokeTests/Atlas.Core.SmokeTests.csproj --configuration Release
      - name: Publier le dossier autonome
        run: dotnet publish src/Atlas.App/Atlas.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.value }} --output publish/portable
      - name: Produire le module de mise à jour
        run: dotnet publish src/Atlas.Updater/Atlas.Updater.csproj --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.value }} --output publish/updater
      - name: Ajouter le module au pack
        shell: pwsh
        run: Copy-Item publish/updater/Atlas.Updater.exe publish/portable/Atlas.Updater.exe -Force
      - name: Créer la mise à jour différentielle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/update | Out-Null
          $changed = @("Atlas.exe", "Atlas.dll", "Atlas.Core.dll", "Atlas.deps.json", "Atlas.runtimeconfig.json")
          foreach ($file in $changed) { Copy-Item "publish/portable/$file" "publish/update/$file" -Force }
          Compress-Archive -Path publish/update/* -DestinationPath publish/Atlas-update.zip
      - name: Installer le compilateur de l’installateur Windows
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compiler l’installateur Windows
        shell: pwsh
        run: |
          $payload = (Resolve-Path publish/portable).Path
          $output = (Resolve-Path publish).Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAtlasVersion=${{ steps.version.outputs.value }}" "/DPayloadDir=$payload" "/DOutputDir=$output" deployment/Atlas.iss
      - name: Créer la GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "${{ steps.version.outputs.tag }}" "publish/Atlas-Setup-${{ steps.version.outputs.value }}-win-x64.exe" "publish/Atlas-update.zip" --target "${{ github.sha }}" --title "Biblidéo Atlas ${{ steps.version.outputs.value }}" --generate-notes
