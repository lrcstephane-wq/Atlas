name: Compilation Windows

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurer
        run: dotnet restore Atlas.sln
      - name: Compiler
        run: dotnet build Atlas.sln --configuration Release --no-restore
      - name: Contrôles métier
        run: dotnet run --project tests/Atlas.Core.SmokeTests/Atlas.Core.SmokeTests.csproj --configuration Release --no-build
      - name: Générer les captures visuelles Horizon
        timeout-minutes: 3
        run: dotnet run --project tests/Atlas.VisualSnapshots/Atlas.VisualSnapshots.csproj --configuration Release --no-build -- artifacts/visual-snapshots
      - name: Publier les captures de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-visual-snapshots
          path: artifacts/visual-snapshots/*.png
          if-no-files-found: error
      - name: Produire Atlas pour Windows
        run: dotnet publish src/Atlas.App/Atlas.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false --output artifacts/Atlas-win-x64
      - name: Produire le module de mise à jour
        run: dotnet publish src/Atlas.Updater/Atlas.Updater.csproj --configuration Release -p:DebugType=None -p:DebugSymbols=false --output artifacts/updater
      - name: Ajouter le module au pack
        shell: pwsh
        run: Copy-Item artifacts/updater/Atlas.Updater.exe artifacts/Atlas-win-x64/Atlas.Updater.exe -Force
      - name: Créer l’archive portable
        shell: pwsh
        run: Compress-Archive -Path artifacts/Atlas-win-x64/* -DestinationPath artifacts/Atlas-win-x64.zip
      - name: Publier l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-win-x64
          path: artifacts/Atlas-win-x64.zip
          if-no-files-found: error
