name: Compilation Windows

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurer
        run: dotnet restore Atlas.sln
      - name: Compiler
        run: dotnet build Atlas.sln --configuration Release --no-restore
      - name: Contrôles métier
        run: dotnet run --project tests/Atlas.Core.SmokeTests/Atlas.Core.SmokeTests.csproj --configuration Release --no-build
      - name: Produire Atlas pour Windows
        run: dotnet publish src/Atlas.App/Atlas.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/Atlas-win-x64
      - name: Publier l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-win-x64
          path: artifacts/Atlas-win-x64/Atlas.exe
          if-no-files-found: error
